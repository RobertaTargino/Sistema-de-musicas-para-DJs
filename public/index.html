<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Músicas para DJs</title>
</head>

<body>

    <h1>Sistema de Músicas para DJs</h1>

    <h2>Cadastro</h2>

    <form id="registerForm">
        <input type="email" id="registerEmail" placeholder="E-mail" required>
        <input type="password" id="registerPassword" placeholder="Senha" required>
        <button type="submit">Cadastrar</button>
    </form>

    <h2>Login</h2>

    <form id="loginForm">
        <input type="email" id="loginEmail" placeholder="E-mail" required>
        <input type="password" id="loginPassword" placeholder="Senha" required>
        <button type="submit">Entrar</button>
    </form>

    <h2>Músicas</h2>

    <button id="getMusicasBtn">Obter Músicas</button>

    <ul id="musicasList"></ul>

    <script>

        document.getElementById('registerForm').addEventListener('submit', async (e) => {

            e.preventDefault();

            const email = document.getElementById('registerEmail').value;
            const password = document.getElementById('registerPassword').value;

            const response = await fetch('/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password })
            });

            if (response.ok) {
                alert('Usuário cadastrado com sucesso!');
            } else {
                alert('Erro ao cadastrar usuário.');
            }

        });

        document.getElementById('loginForm').addEventListener('submit', async (e) => {

            e.preventDefault();

            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;

            const response = await fetch('/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password })
            });

            const data = await response.json();

            if (response.ok) {
                localStorage.setItem('token', data.token);
                alert('Login realizado com sucesso!');
            } else {
                alert('Falha no login.');
            }

        });

        document.getElementById('getMusicasBtn').addEventListener('click', async () => {

            const token = localStorage.getItem('token');

            if (!token) {
                alert('Faça login primeiro!');
                return;
            }

            const response = await fetch('/musicas', {
                headers: {
                    Authorization: `Bearer ${token}`
                }
            });

            const musicas = await response.json();

            if (response.ok) {

                const musicasList = document.getElementById('musicasList');

                musicasList.innerHTML = '';

                musicas.forEach(musica => {

                    const li = document.createElement('li');

                    li.textContent = `${musica.titulo} - ${musica.artista}`;

                    musicasList.appendChild(li);

                });

            } else {

                alert('Erro ao buscar músicas.');

            }

        });

    </script>

</body>

</html>
